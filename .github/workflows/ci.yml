name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Verify website files
      - name: Verify website files
        run: |
          echo "Checking website files..."
          ls -la
          test -f index.html
          echo "Website files verified successfully."

      # 3. Build website
      - name: Build website
        run: |
          echo "Building static website..."
          mkdir -p build
          cp index.html build/
          echo "Build completed successfully."

      # 4. Verify build
      - name: Verify build
        run: |
          echo "Checking build directory..."
          ls -la build
          test -f build/index.html
          echo "CI pipeline completed successfully."
      - name: Temporary failure test
        run: |
          echo "Testing failure notification..."
          exit 1
      # 5. Send Slack success notification
      - name: Send Slack success notification
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"✅ DevOps CI Pipeline completed successfully for devops-webapp."}' \
            "$SLACK_WEBHOOK_URL"

      # 6. Send Slack failure notification
      - name: Send Slack failure notification
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"❌ DevOps CI Pipeline failed for devops-webapp. Please check GitHub Actions logs."}' \
            "$SLACK_WEBHOOK_URL"
