<!DOCTYPE html>
<html>
<head>
    <title>DevOps WebApp</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #232f3e, #146eb4);
            color: white;
            text-align: center;
        }

        .container {
            padding: 120px 20px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            color: #ff9900;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            max-width: 700px;
            margin: 20px auto;
        }

        .box {
            background: white;
            color: #232f3e;
            padding: 30px;
            max-width: 600px;
            margin: 40px auto;
            border-radius: 12px;
        }

        footer {
            margin-top: 80px;
            padding: 20px;
            background: #111;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DevOps WebApp</h1>

        <h2>End-to-End CI/CD Automation</h2>

        <div class="box">
            <h2>Deployment Successful! Version 3</h2>

            <p>
                This website is deployed using GitHub,
                GitHub Actions, Slack ChatOps and Netlify.
            </p>

            <p>
                Every code change can automatically trigger
                the CI/CD pipeline.
            </p>
        </div>

    </div>

    <footer>
        DevOps VLE 3 | CI/CD | ChatOps | Static Deployment
    </footer>

</body>
</html>
