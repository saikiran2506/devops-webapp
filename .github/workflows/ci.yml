name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          echo "Checking website files..."
          ls -la
          test -f index.html

      - name: Build website
        run: |
          echo "Building static website..."
          mkdir -p build
          cp index.html build/
          echo "Build completed successfully."

      - name: Verify build
        run: |
          echo "Checking build directory..."
          ls -la build
          test -f build/index.html
          echo "CI pipeline completed successfully."

      - name: Deploy website to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "Deploying website to EC2..."

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            build/index.html \
            "$EC2_USER@$EC2_HOST:/home/ec2-user/index.html"

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "sudo cp /home/ec2-user/index.html /var/www/html/index.html && sudo systemctl restart httpd"

          echo "Website deployed successfully to EC2."

      - name: Send Slack notification
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"✅ DevOps CI Pipeline completed successfully for devops-webapp."}' \
            "$SLACK_WEBHOOK_URL"
